name: fork-image

# Build the patched nhx-api image from the 0.8.1 fork and push it to GHCR.
# The upstream release workflow promotes to NGC; this one is intentionally
# limited to the single image the Haruspex cluster consumes.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to publish
        required: true
        default: 0.8.1-p1
  push:
    branches:
      - fix/0.8.1-cve-deps

permissions:
  contents: read
  packages: write

jobs:
  nhx-api:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      IMAGE_TAG: ${{ inputs.tag || '0.8.1-p1' }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push nhx-api
        env:
          BAKE_TAG: ${{ inputs.tag || '0.8.1-p1' }}
          IMAGE_REGISTRY: ghcr.io/kubedoll-heavy-industries/nemo-helix
          BUILD_ARCH: linux/amd64
          CI_COMMIT_SHA: ${{ github.sha }}
          NHX_COLLECT_SOURCES: "0"
        run: |
          set -eux
          docker buildx bake -f docker-bake.hcl nhx-api-docker --push

      - name: Image digest
        run: |
          docker buildx imagetools inspect \
            "ghcr.io/kubedoll-heavy-industries/nemo-helix/nhx-api:${IMAGE_TAG}" \
            || true
